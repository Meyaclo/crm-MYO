<!DOCTYPE html>

<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2433;--mute:#6b7385;--line:#e3e6ec;--accent:#0f6e8c;--accent2:#e8f3f7;--danger:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;font-size:14px}
nav{width:210px;background:#152238;color:#fff;padding:18px 0;flex-shrink:0}

nav a{display:block;padding:10px 18px;color:#c9d3e3;text-decoration:none;cursor:pointer;white-space:nowrap}
nav a.on,nav a:hover{background:#22355a;color:#fff}
.who{padding:18px;color:#8fa0bb;font-size:12px;border-top:1px solid #2a3a55;margin-top:12px}
main{flex:1;padding:24px;overflow:auto}
h2{margin:0 0 16px}h3{margin-top:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;overflow-x:auto}

.kpi b{display:block;font-size:22px;margin:4px 0}

th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}

td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover{background:var(--accent2)}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 12px;cursor:pointer;font-size:13px}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}

input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit;background:#fff}

.gcal{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:#fff}
#toast{position:fixed;bottom:18px;right:18px;background:#152238;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;z-index:20;display:none;max-width:340px}

.mini{font-size:12px;margin-bottom:10px}.mini-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;padding-left:6px}

.mini-g a.sel{background:#c2e7ff;color:#001d35;font-weight:600}.mini-g a.today{background:#1a73e8;color:#fff;font-weight:600}
.cal-side h5{margin:16px 0 6px;font-size:14px;font-weight:500}

.cal-main{display:flex;flex-direction:column;min-width:0;min-height:0}

.cal-today{border-radius:18px;padding:8px 18px;margin-right:8px;font-weight:500;border-color:#dadce0!important}

.cal-nav{background:none;color:#5f6368;font-size:24px;width:36px;height:36px;border-radius:50%;padding:0;line-height:1}

.ad-ev,.m-ev.ad{color:#fff;border-radius:4px;padding:2px 8px;font-size:12px;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tg-body{flex:1;overflow-y:auto;scrollbar-gutter:stable;padding-top:8px}
.tg-hours div{height:48px;font-size:10px;color:#70757a;text-align:right;padding-right:8px}
.tg-hours span{position:relative;top:-7px}
.tg-col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent 48px);cursor:pointer}
.tg-ev{position:absolute;border-radius:5px;color:#fff;font-size:12px;padding:3px 7px;overflow:hidden;box-sizing:border-box;border:1px solid #fff;cursor:pointer;line-height:1.3;z-index:1}
.tg-ev.short{white-space:nowrap;text-overflow:ellipsis;padding-top:1px}.tg-ev b{font-weight:500}.tg-ev span{display:block}
.tg-ev:hover{box-shadow:0 4px 8px rgba(0,0,0,.25);z-index:9!important}
.cal .past{opacity:.62}
.tg-now{position:absolute;left:-1px;right:0;border-top:2px solid #ea4335;z-index:3;pointer-events:none}
.tg-now:before{content:'';position:absolute;left:-7px;top:-7px;width:12px;height:12px;border-radius:50%;background:#ea4335}
.mg{display:flex;flex-direction:column;flex:1;min-height:0}
.mg-h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:11px;color:#70757a;text-transform:uppercase;font-weight:500;padding-top:8px;border-left:1px solid var(--line)}
.mg-b{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));border-left:1px solid var(--line)}
.mc{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px 4px;overflow:hidden;cursor:pointer;min-height:80px}
.mc-n{text-align:center;font-size:12px;margin:3px 0;font-weight:500}
.mc-n span{display:inline-block;min-width:24px;height:24px;line-height:24px;border-radius:12px;padding:0 4px}
.mc-n span:hover{background:#f1f3f4}.mc.out .mc-n span{color:#70757a}.mc.today .mc-n span{background:#1a73e8;color:#fff}
.m-ev{font-size:12px;padding:1px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px;margin-bottom:1px;cursor:pointer}
.m-ev:hover{background:#f1f3f4}.m-ev i{width:8px;height:8px;border-radius:50%;flex-shrink:0}.m-ev b{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.m-ev.ad{display:block}.m-ev.ad:hover{background:inherit;filter:brightness(.95)}
.m-more{font-size:12px;font-weight:500;padding:1px 6px;border-radius:4px}.m-more:hover{background:#f1f3f4}
@media(max-width:800px){.cal{grid-template-columns:minmax(0,1fr);height:calc(100vh - 100px)}.cal-side{display:none}.cal-top{padding:6px}.cal-top h2{font-size:16px;margin-left:4px}.cal-today{padding:6px 10px;margin-right:2px}}
.modal .box.peek{width:min(440px,94vw);padding:10px 14px 18px}
.peek-tools{display:flex;justify-content:flex-end;gap:2px;margin-bottom:4px}
.peek-tools button{background:none;color:#5f6368;width:36px;height:36px;border-radius:50%;padding:0;font-size:17px}.peek-tools button:hover{background:#f1f3f4}
.peek-row{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;margin:10px 0;font-size:14px;color:#3c4043}
.peek-row>i{font-style:normal;text-align:center;color:#5f6368}.peek-sq{width:14px;height:14px;border-radius:4px;display:inline-block;margin-top:6px}
.peek h3{margin:0;font-size:22px;font-weight:400}.peek .mute{font-size:13px}
.peek-client{display:inline-block;margin-top:6px;background:#e8f0fe;color:#1a73e8;border-radius:16px;padding:6px 14px;font-weight:500}.peek-client:hover{background:#d2e3fc}
@media(max-width:800px){body{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;padding:0}nav h1{display:none}.who{border:0;margin:0;padding:10px 18px}.grid2{grid-template-columns:1fr}.week{grid-template-columns:1fr}.day{min-height:auto}}
</style>

<body>
<nav id="nav" style="display:none"></nav>
<main id="app"><p class="mute">Chargement…</p></main>
<div id="modal"></div>
<div id="toast"></div>
<script>
// ======================= CONFIGURATION =======================
const SUPABASE_URL = 'https://ramwufwyvdsnfeepqoio.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BOnwcJ78GLGk7F4L1dFgxg_4Zf0zFqC';
// ID client OAuth Google (Google Cloud Console → Identifiants). Laisser vide = synchro Google Agenda désactivée.
const GOOGLE_CLIENT_ID = '290491731788-dtuj991qm49gke9rnnc7uujddvuds5p4.apps.googleusercontent.com';
// =============================================================

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const KINDS=['brands','users','clients','orders','events'];
const BRANDS=['Rip Curl','Stance','I-SEA','YETI','Coolway','Rudsak','Rehall','Nikkie','Aspen Collection','Trendsplant','Natif'];
const TYPES=['INITIAL','REASSORT','HO','SP','SU','FA','SNOW'];
const COLORS=['#0f6e8c','#c0392b','#8e44ad','#d68910','#1e8449','#2c3e50','#e67e22','#16a085'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const eur=n=>(n||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDate=d=>d?new Date(d+'T00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',year:'2-digit'}):'';
function monday(d){d=new Date(d);d.setDate(d.getDate()-(d.getDay()+6)%7);d.setHours(0,0,0,0);return d}
function toast(m){const t=document.getElementById('toast');t.innerHTML=m;t.style.display='block';clearTimeout(window._to);window._to=setTimeout(()=>t.style.display='none',4500)}

/* ---------- Saisons (SS27 = printemps-été 2027, FW26 = automne-hiver 2026 ; PE/AH acceptés) ---------- */
const SRX=/^(SS|FW|PE|AH)(\d{2})$/;
function sVal(s){const m=SRX.exec(s||'');return m?2000+ +m[2]+((m[1]==='FW'||m[1]==='AH')?.5:0):0}
function sPrev(s){const m=SRX.exec(s||'');return m?m[1]+String(+m[2]-1).padStart(2,'0'):''}
function seasonDate(s){const m=SRX.exec(s||'');if(!m)return iso(new Date());const y=2000+ +m[2];return(m[1]==='FW'||m[1]==='AH')?`${y}-03-01`:`${y-1}-10-01`}
function seasons(){return[...new Set(db.orders.map(o=>o.season).filter(Boolean))].sort((a,b)=>sVal(b)-sVal(a)||b.localeCompare(a))}

function seed(){return{brands:BRANDS.map(n=>({id:uid(),name:n,commission:12,contact:'',notes:''})),users:[{id:uid(),name:'Moi',email:'',color:COLORS[0]}],clients:[],orders:[],events:[]}}
let db={brands:[],users:[],clients:[],orders:[],events:[]},me=null,pending=false,importing=false,impLog='';
const byId=(arr,id)=>db[arr].find(x=>x.id===id);
const yearOf=o=>+(o.date||'').slice(0,4);
const CUR=new Date().getFullYear();
const sortedClients=()=>[...db.clients].sort((a,b)=>(a.name||'').localeCompare(b.name||''));
const myUser=()=>db.users.find(u=>u.email&&N(u.email)===N(me?.email))||db.users[0];
let state={view:'dash',mode:'season',season:'',clientId:null,year:CUR,calView:innerWidth<800?'day':'week',calDate:new Date(),miniDate:null,calScroll:null,hiddenUsers:[],q:'',fActive:'',fBrand:'',fClient:'',fSeason:'',fUser:'',fType:''};

/* ---------- Connexion & synchronisation Supabase ---------- */
function vLogin(msg){document.getElementById('nav').style.display='none';
document.getElementById('app').innerHTML=`<div class="card" style="max-width:380px;margin:60px auto"><h2>CRM Meyaclo</h2><form id="lf"><div class="f"><label>E-mail</label><input name="email" type="email" required autocomplete="username"></div><div class="f"><label>Mot de passe</label><input name="pw" type="password" required autocomplete="current-password"></div><button type="submit">Se connecter</button><p class="down">${esc(msg||'')}</p></form></div>`;
document.getElementById('lf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const{error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('pw')});if(error)vLogin('Identifiants incorrects.');else start()}}

async function start(){
const{data:{session}}=await sb.auth.getSession();if(!session)return vLogin();
me=session.user;document.getElementById('nav').style.display='';
document.getElementById('app').innerHTML='<p class="mute">Chargement des données…</p>';
try{await loadAll()}catch(e){document.getElementById('app').innerHTML=`<p class="down">Erreur de connexion à la base : ${esc(e.message)}</p>`;return}
if(!db.brands.length&&!db.users.length){const s=seed();s.users[0].name=me.email.split('@')[0];s.users[0].email=me.email;await putMany([...s.brands.map(x=>['brands',x]),...s.users.map(x=>['users',x])]);db=s}
listen();render();gSync(true)}

async function loadAll(){const d={brands:[],users:[],clients:[],orders:[],events:[]};
for(let from=0;;from+=1000){const{data,error}=await sb.from('records').select('id,kind,data').order('id').range(from,from+999);if(error)throw error;data.forEach(r=>{if(d[r.kind])d[r.kind].push(r.data)});if(data.length<1000)break}db=d}

async function putMany(items,onProgress){for(let i=0;i<items.length;i+=500){const{error}=await sb.from('records').upsert(items.slice(i,i+500).map(([k,o])=>({id:o.id,kind:k,data:o,updated_at:new Date().toISOString()})));if(error){alert('Erreur d\'enregistrement : '+error.message);return false}if(onProgress)onProgress(Math.min(i+500,items.length),items.length)}return true}

function listen(){sb.channel('records').on('postgres_changes',{event:'*',schema:'public',table:'records'},p=>{
if(p.eventType==='DELETE'){const id=p.old.id;KINDS.forEach(k=>db[k]=db[k].filter(x=>x.id!==id))}
else{const r=p.new;if(!db[r.kind])return;const i=db[r.kind].findIndex(x=>x.id===r.id);if(i>=0)db[r.kind][i]=r.data;else db[r.kind].push(r.data)}
refresh()}).subscribe()}
function refresh(){clearTimeout(window._rf);window._rf=setTimeout(()=>{if(importing||document.getElementById('modal').innerHTML||document.activeElement?.id==='q'){pending=true;return}render()},300)}
async function logout(){await sb.auth.signOut();location.reload()}

function upsert(arr,id,d){let o;if(id){o=byId(arr,id);Object.assign(o,d)}else{o={id:uid(),...d};db[arr].push(o)}putMany([[arr,o]]);return o}
function remove(arr,id){db[arr]=db[arr].filter(x=>x.id!==id);sb.from('records').delete().eq('id',id).then(({error})=>{if(error)alert('Erreur de suppression : '+error.message)})}

/* ---------- Google Agenda : synchronisation dans les deux sens ----------
   Chaque membre connecte SON compte Google (bouton dans l'Agenda).
   CRM → Google : un RDV créé/modifié/supprimé dans le CRM l'est aussi dans l'agenda Google de son « propriétaire »
     (la personne qui l'a créé) ; le commercial affecté reçoit une invitation. Si un collègue modifie ou supprime
     ce RDV, l'agenda Google du propriétaire est mis à jour dès que celui-ci ouvre le CRM.
   Google → CRM : à l'ouverture du CRM puis toutes les 2 minutes, les changements faits dans Google
     (date, horaire, titre, lieu, suppression) sont repris dans le CRM.
   Les autres événements Google s'affichent en gris dans l'Agenda (visibles par vous seul) ; un clic permet de
   les ajouter au CRM. Option « Importer tout mon planning Google » : ajout automatique (visible par l'équipe). */
const GSCOPE='https://www.googleapis.com/auth/calendar.events';
const GAPI='https://www.googleapis.com/calendar/v3/calendars/primary/events';
const GSRC='meyaclo';
let gTok=null,gClient=null,gSyncing=false,gLastSync=0,gEv={},gLoading={};
try{gTok=JSON.parse(localStorage.getItem('gtok')||'null')}catch(e){}
const gValid=()=>gTok&&gTok.exp>Date.now()+60000;
const gWanted=()=>{try{return !!GOOGLE_CLIENT_ID&&localStorage.getItem('gcal')==='1'}catch(e){return false}};
const gImportAll=()=>{try{return localStorage.getItem('gimport')==='1'}catch(e){return false}};
const gMine=e=>!!e?.gcalId&&N(e.gcalOwner)===N(me?.email);
function gInit(){if(!gClient&&GOOGLE_CLIENT_ID&&window.google?.accounts?.oauth2)gClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:GSCOPE,callback:()=>{}});return gClient}
// À appeler directement depuis un clic (sinon le navigateur bloque la fenêtre Google)
function gToken(interactive){return new Promise((res,rej)=>{if(gValid())return res(gTok.t);const c=gInit();if(!c)return rej(new Error('Module Google non chargé'));
c.callback=r=>{if(r.error)return rej(new Error(r.error));gTok={t:r.access_token,exp:Date.now()+(+r.expires_in||3600)*1000};try{localStorage.setItem('gtok',JSON.stringify(gTok));localStorage.setItem('gcal','1')}catch(e){}res(gTok.t)};
c.error_callback=e=>rej(new Error(e?.type||'fenêtre fermée'));
c.requestAccessToken({prompt:interactive?'consent':'',hint:me?.email})})}
async function gFetch(t,url,method,body){const r=await fetch(url,{method,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
if(r.status===401){gTok=null;try{localStorage.removeItem('gtok')}catch(e){}}return r}
const addH=h=>{const[a,b]=h.split(':').map(Number);const m=Math.min(a*60+b+60,1439);return`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`};
const nextDay=d=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+1);return iso(x)};
const gHHMM=d=>`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
function gTimes(g){if(g.start?.date)return{date:g.start.date,start:'',end:''};const s=new Date(g.start.dateTime),en=new Date(g.end.dateTime);return{date:iso(s),start:gHHMM(s),end:iso(en)===iso(s)?gHHMM(en):''}}
const gAddr=c=>c?[c.address,c.zip,c.city].filter(Boolean).join(' '):'';
function gBody(e,metaOnly){const props={extendedProperties:{private:{crmId:e.id,crmSrc:GSRC}}};if(metaOnly)return props;
const u=byId('users',e.userId),c=byId('clients',e.clientId),tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Paris';
const dt=(d,h)=>({dateTime:`${d}T${h}:00`,timeZone:tz});
const b={summary:`${!e.fromGoogle&&e.type?e.type+' · ':''}${e.title}${c?' — '+c.name:''}`,location:e.place||gAddr(c),...props};
if(!e.fromGoogle){b.description=[c&&('Client : '+c.name),c?.contact&&('Contact : '+c.contact),(c?.phone||c?.mobile)&&('Tél : '+(c.phone||c.mobile)),u&&('Commercial : '+u.name),e.report&&('\nCompte rendu :\n'+e.report),'\n— Créé depuis le CRM Meyaclo'].filter(Boolean).join('\n');
if(u?.email&&N(u.email)!==N(me?.email))b.attendees=[{email:u.email}]}
if(e.start){b.start=dt(e.date,e.start);b.end=dt(e.date,e.end&&e.end>e.start?e.end:addH(e.start))}else{b.start={date:e.date};b.end={date:nextDay(e.date)}}
return b}
// Envoie un RDV du CRM vers Google (création ou mise à jour)
async function gPush(e,o={}){if(!gWanted()||!e)return;
if(e.gcalOwner&&N(e.gcalOwner)!==N(me?.email))return; // RDV d'un collègue : son navigateur s'en charge
let t;try{t=await gToken(false)}catch(err){if(!o.quiet)toast('Google Agenda : reconnectez-vous (bouton dans l\'Agenda).');return}
try{let r;
if(e.gcalId){r=await gFetch(t,`${GAPI}/${encodeURIComponent(e.gcalId)}?sendUpdates=${e.fromGoogle?'none':'all'}`,'PATCH',gBody(e,o.meta));if(r.status===404||r.status===410)r=null}
if(!r)r=await gFetch(t,`${GAPI}?sendUpdates=all`,'POST',gBody(e));
if(!r.ok)throw new Error((await r.json().catch(()=>({})))?.error?.message||r.status);
const j=await r.json(),cur=byId('events',e.id)||e;
Object.assign(cur,{gcalId:j.id,gcalOwner:me.email,gcalEtag:j.etag,gcalV:2,gcalSynced:cur.crmUpdated||Date.now()});await putMany([['events',cur]]);
if(!o.quiet)toast('📅 RDV enregistré dans Google Agenda');return true}
catch(err){if(!o.quiet)toast('Google Agenda : échec de l\'envoi ('+esc(err.message)+')');return false}}
async function gDel(e){if(!gWanted()||!gMine(e))return;
try{const t=await gToken(false);await gFetch(t,`${GAPI}/${encodeURIComponent(e.gcalId)}?sendUpdates=${e.fromGoogle?'none':'all'}`,'DELETE');toast('📅 RDV retiré de Google Agenda')}catch(err){toast('Google Agenda : RDV non supprimé, faites-le à la main.')}}
// Reprend dans le CRM une modification faite dans Google
function gApply(e,g){const cur=byId('events',e.id)||e,c=byId('clients',cur.clientId);let t=g.summary||cur.title;
if(c&&t.endsWith(' — '+c.name))t=t.slice(0,-(' — '+c.name).length);
if(!cur.fromGoogle&&cur.type&&t.startsWith(cur.type+' · '))t=t.slice((cur.type+' · ').length);
const loc=g.location||'';
Object.assign(cur,{title:t,...gTimes(g),place:loc===gAddr(c)?(cur.place||''):loc,gcalEtag:g.etag});cur.crmUpdated=cur.gcalSynced=Date.now();
putMany([['events',cur]])}
// Synchronisation complète (sans fenêtre Google : ne tourne que si la connexion est encore valide)
async function gSync(force){if(!gWanted()||!gValid()||gSyncing||!me||!db.users.length)return;
if(!force&&Date.now()-gLastSync<60000)return;
gSyncing=true;gLastSync=Date.now();let changed=0;const t=gTok.t;
try{
const from=new Date();from.setDate(from.getDate()-60);from.setHours(0,0,0,0);const fromIso=iso(from);
const list=async q=>{let out=[],pt='';do{const r=await gFetch(t,`${GAPI}?singleEvents=true&maxResults=2500${q}${pt?'&pageToken='+encodeURIComponent(pt):''}`,'GET');if(!r.ok)throw new Error(r.status);const j=await r.json();out=out.concat(j.items||[]);pt=j.nextPageToken}while(pt);return out};
const A=await list(`&privateExtendedProperty=${encodeURIComponent('crmSrc='+GSRC)}&timeMin=${encodeURIComponent(from.toISOString())}`);
const byG=new Map(A.map(g=>[g.id,g]));
// 1. Mes RDV du CRM présents dans Google
for(const e of db.events.filter(x=>gMine(x)&&x.date>=fromIso)){
let g=byG.get(e.gcalId);byG.delete(e.gcalId);
if(!g){if(e.gcalV!==2){await gPush(e,{quiet:1});continue}
const r=await gFetch(t,`${GAPI}/${encodeURIComponent(e.gcalId)}`,'GET');
if(r.status===404||r.status===410){remove('events',e.id);changed++;continue}
if(!r.ok)continue;g=await r.json();if(g.status==='cancelled'){remove('events',e.id);changed++;continue}}
const crmNew=(e.crmUpdated||0)>(e.gcalSynced||0),gNew=g.etag!==e.gcalEtag;
if(gNew&&(!crmNew||Date.parse(g.updated)>(e.crmUpdated||0))){gApply(e,g);changed++}
else if(crmNew){await gPush(e,{quiet:1});changed++}}
// 2. RDV supprimés du CRM (par un collègue) mais encore dans mon Google Agenda
for(const g of byG.values()){const id=g.extendedProperties?.private?.crmId;if(!id||byId('events',id))continue;
const{data,error}=await sb.from('records').select('id').eq('id',id);if(error||data?.length)continue;
await gFetch(t,`${GAPI}/${encodeURIComponent(g.id)}?sendUpdates=all`,'DELETE');changed++}
// 3. Option : importer tout le planning Google (6 prochains mois)
if(gImportAll()){const d0=new Date();d0.setHours(0,0,0,0);const d1=new Date(d0);d1.setDate(d1.getDate()+180);
const B=await list(`&timeMin=${encodeURIComponent(d0.toISOString())}&timeMax=${encodeURIComponent(d1.toISOString())}`);
const known=new Set(db.events.map(e=>e.gcalId).filter(Boolean)),u=myUser();
for(const g of B){if(g.status==='cancelled'||known.has(g.id)||g.extendedProperties?.private?.crmSrc||(g.eventType&&g.eventType!=='default'))continue;
const e={id:uid(),title:g.summary||'(sans titre)',type:'Autre',userId:u?.id||'',clientId:'',place:g.location||'',report:'',...gTimes(g),fromGoogle:true,gcalId:g.id,gcalOwner:me.email,crmUpdated:Date.now()};
db.events.push(e);await putMany([['events',e]]);await gPush(e,{quiet:1,meta:1});changed++}}
}catch(err){console.warn('Synchro Google Agenda :',err)}
gSyncing=false;if(changed){gEv={};if(!document.getElementById('modal').innerHTML)render()}}
setInterval(()=>{if(document.visibilityState==='visible')gSync()},120000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')gSync()});

/* Affichage du planning Google (événements non présents dans le CRM), semaine par semaine */
async function gLoadRange(ws,days,force){const k=iso(ws)+'|'+days;if(!gWanted()||gLoading[k]||(!force&&Array.isArray(gEv[k])))return;
if(!gValid()){gEv[k]=null;return}
gLoading[k]=1;
try{const end=addDays(ws,days);
const r=await gFetch(gTok.t,`${GAPI}?singleEvents=true&orderBy=startTime&maxResults=2500&timeMin=${encodeURIComponent(ws.toISOString())}&timeMax=${encodeURIComponent(end.toISOString())}`,'GET');
if(r.status===401){gEv[k]=null}else{if(!r.ok)throw new Error(r.status);const j=await r.json();
const crmG=new Set(db.events.map(e=>e.gcalId).filter(Boolean)),out=[];
for(const it of j.items||[]){if(it.status==='cancelled'||crmG.has(it.id)||it.extendedProperties?.private?.crmId||it.eventType==='workingLocation')continue;
const base={gid:it.id,title:it.summary||'(sans titre)',place:it.location||'',link:it.htmlLink||''};
if(it.start?.date){for(let d=new Date(it.start.date+'T00:00');iso(d)<it.end.date;d.setDate(d.getDate()+1))out.push({...base,date:iso(d),start:'',end:'',allDay:1})}
else if(it.start?.dateTime)out.push({...base,...gTimes(it)})}
gEv[k]=out}}
catch(e){gEv[k]=[];toast('Google Agenda : lecture impossible ('+esc(e.message)+')')}
delete gLoading[k];if(state.view==='agenda'&&calKey(calRange())===k)render()}
function gRefresh(){gToken(false).then(async()=>{gEv={};await gSync(true);render()}).catch(()=>toast('Google Agenda : reconnectez-vous.'))}
function gEvLine(g){return`<div class="ev gev" onclick="event.stopPropagation();gAdd('${esc(g.gid)}','${esc(g.date)}')" title="Cliquez pour l'ajouter au CRM"><b>${g.allDay?'Journée':esc(g.start)+(g.end?'–'+esc(g.end):'')}</b> <span class="mute">· Google</span><br>${esc(g.title)}${g.place?'<br><i>'+esc(g.place)+'</i>':''}</div>`}
function gAdd(gid,date){const g=Object.values(gEv).filter(Array.isArray).flat().find(x=>x.gid===gid&&x.date===date);if(!g)return;
editEvent(null,null,null,{title:g.title,date:g.date,start:g.start,end:g.end,place:g.place,type:'Autre',gcalId:g.gid,link:g.link})}
function gConnect(){gToken(true).then(async()=>{toast('✅ Google Agenda connecté');gEv={};render();await gSync(true)}).catch(e=>alert('Connexion Google impossible : '+e.message))}
function gDisconnect(){try{if(gTok&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(gTok.t,()=>{});localStorage.removeItem('gtok');localStorage.removeItem('gcal')}catch(e){}gTok=null;gEv={};toast('Google Agenda déconnecté');render()}
function gSetImport(v){if(v&&!confirm('Tous vos événements Google des 6 prochains mois seront ajoutés au CRM, et donc visibles par toute l\'équipe. Continuer ?'))return render();
try{localStorage.setItem('gimport',v?'1':'0')}catch(e){}if(v)gRefresh();else render()}
async function gSyncAll(){const today=iso(new Date()),u=myUser();
const list=db.events.filter(e=>e.date>=today&&!e.gcalId&&(e.userId===u?.id));
if(!list.length)return toast('Tous vos RDV à venir sont déjà dans Google Agenda.');
try{await gToken(false)}catch(e){return toast('Google Agenda : reconnectez-vous.')}
let n=0;for(const e of list)if(await gPush(e,{quiet:1}))n++;toast(`📅 ${n} / ${list.length} RDV envoyés dans Google Agenda`);render()}
function gBar(){if(!GOOGLE_CLIENT_ID)return'<span class="mute">Google Agenda : non configuré</span>';
if(!gWanted())return`<button class="ghost" onclick="gConnect()">📅 Connecter mon Google Agenda</button>`;
if(!gValid())return`<span class="gcal"><span class="down">●</span> Synchro Google en pause <button onclick="gRefresh()">🔄 Reprendre</button><button class="ghost" onclick="gDisconnect()">Déconnecter</button></span>`;
return`<span class="gcal"><span class="up">●</span> Google Agenda synchronisé${gSyncing?' <span class="mute">(en cours…)</span>':''} <button class="ghost" onclick="gRefresh()" title="Synchroniser maintenant">↻</button><button class="ghost" onclick="gSyncAll()">Envoyer mes RDV à venir</button><label class="chip" style="margin:0" title="Ajoute au CRM tous vos événements Google des 6 prochains mois (visibles par l'équipe)"><input type="checkbox" ${gImportAll()?'checked':''} onchange="gSetImport(this.checked)">Importer tout mon planning</label><button class="ghost" onclick="gDisconnect()">Déconnecter</button></span>`}

/* ---------- Calculs ---------- */
const ok=o=>o.status!=='Annulée';
function ca(f){return db.orders.reduce((s,o)=>ok(o)&&f(o)?s+(+o.amount||0):s,0)}
function comm(o){const b=byId('brands',o.brandId);return ok(o)?(+o.amount||0)*((+b?.commission||0)/100):0}
function agg(keyFn,f){const m=new Map();for(const o of db.orders){if(!ok(o)||!f(o))continue;const k=keyFn(o);let a=m.get(k);if(!a)m.set(k,a={v:0,obj:0,n1:0,c:0,n:0});a.v+=+o.amount||0;a.obj+=+o.objective||0;a.n1+=+o.n1||0;a.c+=comm(o);a.n++}return m}
const Z={v:0,obj:0,n1:0,c:0,n:0};
function years(){const s=new Set(db.orders.map(yearOf).filter(Boolean));s.add(CUR);return[...s].sort((a,b)=>b-a)}
function evo(a,b){if(!b)return a?'<span class="up">nouveau</span>':'—';const p=(a-b)/b*100;return`<span class="${p>=0?'up':'down'}">${p>=0?'+':''}${p.toFixed(0)} %</span>`}
function pct(a,b){if(!b)return'—';const p=a/b*100;return`<span class="${p>=100?'up':'down'}">${p.toFixed(0)} %</span>`}
function curSeason(){const ss=seasons();if(!ss.includes(state.season))state.season=ss[0]||'';return state.season}

/* ---------- Agenda (présentation façon agenda en ligne : jour / semaine / mois) ---------- */
const HOUR=48,WD=['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'];
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const toMin=h=>h?(+h.slice(0,2))*60+ +h.slice(3,5):0;
const fromMin=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
function calRange(){const d=new Date(state.calDate);d.setHours(0,0,0,0);
if(state.calView==='day')return{start:d,days:1};
if(state.calView==='month')return{start:monday(new Date(d.getFullYear(),d.getMonth(),1)),days:42};
return{start:monday(d),days:7}}
const calKey=r=>iso(r.start)+'|'+r.days;
function calItems(r){const from=iso(r.start),to=iso(addDays(r.start,r.days)),out=[],now=new Date(),nowIso=iso(now),nowHM=gHHMM(now);
for(const e of db.events){if(state.hiddenUsers.includes(e.userId)||!e.date||e.date<from||e.date>=to)continue;const u=byId('users',e.userId),c=byId('clients',e.clientId);
out.push({date:e.date,start:e.start||'',end:e.end||'',allDay:!e.start,title:e.title||'(sans titre)',sub:[c?.name,e.place].filter(Boolean).join(', '),color:u?.color||'#039be5',click:`evPeek('${e.id}')`,tip:[e.type,u?.name,e.gcalId?'synchronisé Google':''].filter(Boolean).join(' · ')})}
if(gWanted()&&state.showG!==false)for(const g of gEv[calKey(r)]||[])out.push({date:g.date,start:g.start,end:g.end,allDay:!!g.allDay,title:g.title,sub:g.place,color:'#7986cb',click:`gAdd('${esc(g.gid)}','${g.date}')`,tip:'Votre agenda Google (visible par vous seul) : cliquez pour l\'ajouter au CRM'});
out.forEach(x=>x.past=x.date<nowIso||(x.date===nowIso&&!x.allDay&&(x.end||fromMin(Math.min(toMin(x.start)+60,1439)))<=nowHM));
return out}
// Répartit les RDV qui se chevauchent en colonnes
function calLayout(list){const ev=list.map(x=>{const s=toMin(x.start);let e=x.end?toMin(x.end):s+60;if(e<=s)e=s+30;return{...x,s,e}}).sort((a,b)=>a.s-b.s||b.e-a.e);
let cluster=[],cols=[],maxEnd=-1;const flush=()=>{cluster.forEach(x=>x.n=cols.length);cluster=[];cols=[];maxEnd=-1};
for(const x of ev){if(x.s>=maxEnd)flush();let i=cols.findIndex(end=>end<=x.s);if(i<0){i=cols.length;cols.push(0)}cols[i]=x.e;x.col=i;cluster.push(x);maxEnd=Math.max(maxEnd,x.e)}
flush();return ev}
const evBlock=x=>{const h=Math.max((x.e-x.s)/60*HOUR-2,18),short=h<40,l=x.col/x.n*100,w=x.col===x.n-1?100/x.n:Math.min(100-l,100/x.n*1.7);
return`<div class="tg-ev${x.past?' past':''}${short?' short':''}" style="top:${x.s/60*HOUR}px;height:${h}px;left:calc(${l}% + 1px);width:calc(${w}% - 8px);z-index:${1+x.col};background:${x.color}" title="${esc(x.tip)}" onclick="event.stopPropagation();${x.click}"><b>${esc(x.title)}</b>${short?`, ${esc(x.start)}`:`<span>${esc(x.start)}${x.end?' – '+esc(x.end):''}</span>${x.sub?`<span>${esc(x.sub)}</span>`:''}`}</div>`};
const adChip=x=>`<div class="ad-ev${x.past?' past':''}" style="background:${x.color}" title="${esc(x.tip)}" onclick="event.stopPropagation();${x.click}">${esc(x.title)}</div>`;
const mChip=x=>x.allDay?`<div class="m-ev ad${x.past?' past':''}" style="background:${x.color}" title="${esc(x.tip)}" onclick="event.stopPropagation();${x.click}">${esc(x.title)}</div>`
:`<div class="m-ev${x.past?' past':''}" title="${esc(x.tip)}" onclick="event.stopPropagation();${x.click}"><i style="background:${x.color}"></i>${esc(x.start)} <b>${esc(x.title)}</b></div>`;

function miniCal(){const m=state.miniDate?new Date(state.miniDate):new Date(state.calDate);m.setDate(1);const s=monday(m),today=iso(new Date()),sel=iso(new Date(state.calDate)),r=calRange(),rf=iso(r.start),rt=iso(addDays(r.start,r.days));
return`<div class="mini"><div class="mini-top"><b>${m.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</b><span><button class="cal-nav sm" onclick="calMini(-1)">‹</button><button class="cal-nav sm" onclick="calMini(1)">›</button></span></div><div class="mini-g">${['L','M','M','J','V','S','D'].map(x=>`<i>${x}</i>`).join('')}${[...Array(42)].map((_,i)=>{const d=addDays(s,i),k=iso(d);return`<a class="${d.getMonth()!==m.getMonth()?'out':''}${state.calView!=='month'&&k>=rf&&k<rt?' rng':''}${k===sel?' sel':''}${k===today?' today':''}" onclick="calPick('${k}')">${d.getDate()}</a>`}).join('')}</div></div>`}
function calMini(n){const m=state.miniDate?new Date(state.miniDate):new Date(state.calDate);m.setDate(1);m.setMonth(m.getMonth()+n);state.miniDate=m;render()}
function calPick(k){state.calDate=new Date(k+'T00:00');state.miniDate=null;render()}
function calGo(v,k){state.calView=v;if(k)state.calDate=new Date(k+'T00:00');state.miniDate=null;state.calScroll=null;render()}
function calShift(n){const d=new Date(state.calDate);if(state.calView==='month'){d.setDate(1);d.setMonth(d.getMonth()+n)}else d.setDate(d.getDate()+n*(state.calView==='day'?1:7));state.calDate=d;state.miniDate=null;render()}
function calToday(){state.calDate=new Date();state.miniDate=null;state.calScroll=null;render()}
function calSlot(ev,date){const r=ev.currentTarget.getBoundingClientRect(),m=Math.max(0,Math.min(1410,Math.floor((ev.clientY-r.top)/HOUR*2)*30));editEvent(null,null,date,{start:fromMin(m),end:fromMin(Math.min(m+60,1439))})}
document.addEventListener('keydown',e=>{if(state.view!=='agenda'||document.getElementById('modal').innerHTML||/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||'')||e.metaKey||e.ctrlKey||e.altKey)return;
const a={t:calToday,d:()=>calGo('day'),w:()=>calGo('week'),s:()=>calGo('week'),m:()=>calGo('month'),j:()=>calShift(1),n:()=>calShift(1),k:()=>calShift(-1),p:()=>calShift(-1),c:()=>editEvent(),ArrowRight:()=>calShift(1),ArrowLeft:()=>calShift(-1)}[e.key];
if(a){e.preventDefault();a()}});

function vAgenda(){const r=calRange(),k=calKey(r),days=[...Array(r.days)].map((_,i)=>addDays(r.start,i)),today=iso(new Date()),cd=new Date(state.calDate);
if(gWanted())gLoadRange(r.start,r.days);

const title=state.calView==='day'?cd.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})
:state.calView==='month'?cd.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})
:days[0].getMonth()===days[6].getMonth()?days[0].toLocaleDateString('fr-FR',{month:'long',year:'numeric'})
:days[0].toLocaleDateString('fr-FR',{month:'short'})+' – '+days[6].toLocaleDateString('fr-FR',{month:'short',year:'numeric'});
let body;
if(state.calView==='month'){const mo=cd.getMonth();
body=`<div class="mg"><div class="mg-h">${WD.map(w=>`<div>${w}</div>`).join('')}</div><div class="mg-b">${days.map(d=>{const k=iso(d),l=(by[k]||[]).sort((a,b)=>(a.allDay?'':'1'+a.start).localeCompare(b.allDay?'':'1'+b.start));
return`<div class="mc${d.getMonth()!==mo?' out':''}${k===today?' today':''}" onclick="editEvent(null,null,'${k}')"><div class="mc-n"><span onclick="event.stopPropagation();calGo('day','${k}')">${d.getDate()===1?d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):d.getDate()}</span></div>${l.slice(0,3).map(mChip).join('')}${l.length>3?`<div class="m-more" onclick="event.stopPropagation();calGo('day','${k}')">${l.length-3} autre${l.length>4?'s':''}</div>`:''}</div>`}).join('')}</div></div>`}
else{const nd=new Date(),nowM=nd.getHours()*60+nd.getMinutes();
const head=`<div class="tg-row tg-head">${'<div class="tg-gut"></div>'}${days.map(d=>{const k=iso(d);return`<div class="tg-dh${k===today?' today':''}" onclick="calGo('day','${k}')"><span>${WD[(d.getDay()+6)%7]}</span><b>${d.getDate()}</b></div>`}).join('')}</div>`;
const ad=`<div class="tg-row tg-ad"><div class="tg-gut"></div>${days.map(d=>{const k=iso(d);return`<div class="tg-adc" onclick="editEvent(null,null,'${k}',{start:'',end:''})">${(by[k]||[]).filter(x=>x.allDay).map(adChip).join('')}</div>`}).join('')}</div>`;

const cols=days.map(d=>{const k=iso(d);return`<div class="tg-col" onclick="calSlot(event,'${k}')">${calLayout((by[k]||[]).filter(x=>!x.allDay)).map(evBlock).join('')}${k===today?`<div class="tg-now" style="top:${nowM/60*HOUR}px"></div>`:''}</div>`}).join('');
body=`<div class="tg" style="--n:${r.days}">${head}${ad}<div class="tg-body" id="tgb" onscroll="state.calScroll=this.scrollTop"><div class="tg-row" style="height:${24*HOUR}px">${hours}${cols}</div></div></div>`}

<h5>Agendas de l'équipe</h5>${db.users.map(u=>`<label class="cal-chk"><input type="checkbox" ${state.hiddenUsers.includes(u.id)?'':'checked'} onchange="toggleUser('${u.id}')" style="accent-color:${u.color}">${esc(u.name)}</label>`).join('')}
${gWanted()?`<label class="cal-chk"><input type="checkbox" ${state.showG!==false?'checked':''} onchange="state.showG=this.checked;render()" style="accent-color:#7986cb"><span title="Visible par vous seul">Mon agenda Google</span></label>`:''}
<h5>Synchronisation Google</h5><div class="cal-sync">${gBar()}</div>
<p class="mute" style="font-size:11px;margin-top:16px">Raccourcis : T aujourd'hui · J/K suivant/précédent · J, S, M vues jour/semaine/mois (D/W aussi) · C créer.</p></aside>`;
return`<div class="cal">${side}<section class="cal-main"><header class="cal-top"><button class="ghost cal-today" onclick="calToday()">Aujourd'hui</button><button class="cal-nav" onclick="calShift(-1)" title="Précédent">‹</button><button class="cal-nav" onclick="calShift(1)" title="Suivant">›</button><h2>${esc(title)}</h2><span style="flex:1"></span>${gLoading[k]?'<span class="mute" style="font-size:12px">Chargement Google…</span>':''}<select class="cal-view" onchange="calGo(this.value)">${[['day','Jour'],['week','Semaine'],['month','Mois']].map(([v,l])=>`<option value="${v}" ${state.calView===v?'selected':''}>${l}</option>`).join('')}</select></header>${body}</section></div>`}

/* ---------- Import Excel ---------- */
const num=v=>typeof v==='number'?v:(parseFloat(String(v??'').replace(/\s/g,'').replace(/[  ]/g,'').replace(',','.'))||0);
const str=v=>String(v??'').trim();
const zip5=v=>{const s=str(v);return /^\d{4}$/.test(s)?'0'+s:s};
const BRAND_NAMES={FREEMANTPORTER:'Freeman T. Porter',ISEA:'I-SEA',YETI:'YETI'};
const nice=s=>BRAND_NAMES[N(s)]||str(s).toLowerCase().replace(/(^|[\s\-.])(\S)/g,(m,a,b)=>a+b.toUpperCase());

function sheetRows(wb){const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
const hi=rows.findIndex((r,i)=>i<15&&r.some(c=>N(c)==='NOM'));if(hi<0)return null;
const H={};rows[hi].forEach((c,i)=>{const k=N(c);if(k&&H[k]==null)H[k]=i});
const type=H.SAISON!=null&&H.REALISE!=null?'ca':(H.NOM!=null&&(H.CP!=null||H.INTERLOCUTEURPRINCIPAL!=null||H.VILLE!=null))?'contacts':null;
return{type,H,rows:rows.slice(hi+1)}}

async function importFiles(files){if(!files.length)return;if(typeof XLSX==='undefined')return alert('Module Excel non chargé (connexion internet requise).');
impLog='';const log=m=>{impLog+=m+'<br>';const L=document.getElementById('implog');if(L)L.innerHTML=impLog};
const parsed=[];for(const f of files){try{const p=sheetRows(XLSX.read(await f.arrayBuffer()));if(!p||!p.type){log(`⚠️ <b>${esc(f.name)}</b> : format non reconnu, ignoré.`);continue}p.name=f.name;parsed.push(p)}catch(e){log(`⚠️ <b>${esc(f.name)}</b> : lecture impossible (${esc(e.message)}).`)}}
parsed.sort((a,b)=>(a.type==='contacts'?0:1)-(b.type==='contacts'?0:1));
if(!parsed.length)return;
importing=true;const items=new Map();const put=(k,o)=>items.set(o.id,[k,o]);
try{
for(const p of parsed){const g=(r,k)=>p.H[k]!=null?r[p.H[k]]:'';
if(p.type==='contacts'){const byKey=new Map(db.clients.map(c=>[c.ikey||(N(c.name)+'|'+(c.zip||'')+'|'+N(c.address)),c]));let nw=0,up=0;
for(const r of p.rows){const name=str(g(r,'NOM'));if(!name)continue;
const d={name,address:str(g(r,'ADRESSE')),zip:zip5(g(r,'CP')||g(r,'CODEPOSTAL')),city:str(g(r,'VILLE')),country:str(g(r,'PAYS')),sector:str(g(r,'SECTEUR')),email:str(g(r,'EMAIL')||g(r,'EMAIL')),contact:str(g(r,'INTERLOCUTEURPRINCIPAL')||g(r,'CONTACT')),phone:str(g(r,'TELEPHONE')),mobile:str(g(r,'PORTABLE')),hq:str(g(r,'NOMDUSIEGESOCIAL'))};
d.dept=d.zip.slice(0,2);d.ikey=N(name)+'|'+d.zip+'|'+N(d.address);
let c=byKey.get(d.ikey);
if(c){Object.keys(d).forEach(k=>{if(d[k])c[k]=d[k]});up++}else{c={id:uid(),...d,notes:''};db.clients.push(c);byKey.set(d.ikey,c);nw++}
put('clients',c)}
log(`✅ <b>${esc(p.name)}</b> : ${nw} clients créés, ${up} mis à jour.`)}

if(p.type==='ca'){
// Index clients par nom : si plusieurs magasins portent le même nom, on rattache le CA à la fiche la plus complète
const score=c=>['email','contact','phone','address','mobile'].filter(k=>c[k]).length;
const byName=new Map(),multi=new Set();
for(const c of db.clients){const k=N(c.name);const e=byName.get(k);if(e){multi.add(k);if(score(c)>score(e))byName.set(k,c)}else byName.set(k,c)}
const brandOf=new Map(db.brands.map(b=>[N(b.name),b])),userOf=new Map(db.users.map(u=>[N(u.name),u]));
const getBrand=raw=>{const k=N(raw);if(!k)return null;let b=brandOf.get(k);if(!b){b={id:uid(),name:nice(raw),commission:12,contact:'',notes:''};db.brands.push(b);brandOf.set(k,b);log(`➕ Marque créée : ${esc(b.name)} (12 % par défaut)`)}put('brands',b);return b};
const getUser=raw=>{const k=N(raw);if(!k)return null;let u=userOf.get(k);
if(!u){const first=N(str(raw).split(/\s+/)[0]);u=db.users.find(x=>x.email&&N(x.name)===N(x.email.split('@')[0])&&first.startsWith(N(x.email.split(/[.@]/)[0]))&&N(x.email.split(/[.@]/)[0]).length>=3);
if(u){log(`✏️ Membre « ${esc(u.name)} » renommé en ${esc(str(raw))}`);u.name=str(raw)}else{u={id:uid(),name:str(raw),email:'',color:COLORS[db.users.length%COLORS.length]};db.users.push(u);log(`➕ Commercial ajouté : ${esc(u.name)}`)}
userOf.set(k,u)}put('users',u);return u};
const getClient=raw=>{const k=N(raw);let c=byName.get(k);if(!c){c={id:uid(),name:str(raw),notes:'Créé par l\'import CA (absent de la liste des contacts)',ikey:k+'||'};db.clients.push(c);byName.set(k,c);put('clients',c);log(`➕ Client absent des contacts, créé : ${esc(c.name)}`)}return c};
// Regroupe les lignes identiques (même saison, marque, client, type, commercial)
const groups=new Map();
for(const r of p.rows){const season=str(g(r,'SAISON')).toUpperCase().replace(/\s/g,''),cl=str(g(r,'NOM')),br=str(g(r,'MARQUE'));
if(!season||!cl||!br||N(g(r,'EQUIPE'))==='TOTAUX')continue;
const type=str(g(r,'TYPE')).toUpperCase(),usr=str(g(r,'AFFECTEA'));
const key=[season,N(br),N(cl),type,N(usr)].join('|');
let a=groups.get(key);if(!a)groups.set(key,a={season,br,cl,type,usr,amount:0,objective:0,n1:0,s1:0});
a.amount+=num(g(r,'REALISE'));a.objective+=num(g(r,'OBJECTIF'));a.n1+=num(g(r,'N1'));a.s1+=num(g(r,'S1'))}
const byIkey=new Map(db.orders.filter(o=>o.ikey).map(o=>[o.ikey,o]));let nw=0,up=0;const usedMulti=new Set();
for(const[key,a]of groups){const b=getBrand(a.br),u=getUser(a.usr),c=getClient(a.cl);if(multi.has(N(a.cl)))usedMulti.add(a.cl);
const d={clientId:c.id,brandId:b.id,userId:u?.id||'',season:a.season,type:a.type,amount:Math.round(a.amount*100)/100,objective:Math.round(a.objective*100)/100,n1:Math.round(a.n1*100)/100,s1:Math.round(a.s1*100)/100,ikey:key};
let o=byIkey.get(key);if(o){Object.assign(o,d);up++}else{o={id:uid(),...d,date:seasonDate(a.season),status:'Confirmée',delivery:'',ref:'',notes:''};db.orders.push(o);byIkey.set(key,o);nw++}
put('orders',o)}
log(`✅ <b>${esc(p.name)}</b> : ${nw} lignes de CA créées, ${up} mises à jour.`);
if(usedMulti.size)log(`ℹ️ ${usedMulti.size} enseigne(s) ont plusieurs magasins du même nom dans les contacts ; leur CA est rattaché à la fiche la plus complète : ${[...usedMulti].map(esc).join(', ')}.`)}}

log(`⏳ Enregistrement en ligne de ${items.size} fiches…`);
const okSave=await putMany([...items.values()],(d,t)=>{const L=document.getElementById('implog');if(L)L.innerHTML=impLog+`${d} / ${t}<br>`});
log(okSave?'🎉 <b>Import terminé.</b> Allez voir le tableau de bord.':'❌ L\'enregistrement a échoué en cours de route : relancez l\'import, il reprendra sans doublons.');
}catch(e){log('❌ Erreur : '+esc(e.message))}
importing=false;state.season='';nav()}

function exportXlsx(){if(typeof XLSX==='undefined'){alert('Module Excel non chargé (connexion internet requise).');return}
const cn=id=>byId('clients',id)?.name||'',bn=id=>byId('brands',id)?.name||'',un=id=>byId('users',id)?.name||'';
const wb=XLSX.utils.book_new(),add=(name,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{}]),name);
const ss=seasons().reverse();
add('Clients',sortedClients().map(c=>({Enseigne:c.name,Interlocuteur:c.contact,Téléphone:c.phone,Portable:c.mobile,Email:c.email,Adresse:c.address,CP:c.zip,Ville:c.city,Département:c.dept,Secteur:c.sector,'Siège social':c.hq,SIRET:c.siret,Notes:c.notes})));
add('Commandes',[...db.orders].sort(orderSort).map(o=>({Saison:o.season,Client:cn(o.clientId),Marque:bn(o.brandId),Type:o.type,Commercial:un(o.userId),Statut:o.status,Objectif:+o.objective||0,'Réalisé HT':+o.amount||0,'N-1':+o.n1||0,Commission:Math.round(comm(o)*100)/100,Date:o.date,Livraison:o.delivery,'N° commande':o.ref,Notes:o.notes})));
const cols=[];db.brands.forEach(b=>ss.forEach(s=>{if(ca(o=>o.brandId===b.id&&o.season===s))cols.push([b,s])}));
const pc=agg(o=>o.clientId+'|'+o.brandId+'|'+o.season,()=>true),pt=agg(o=>o.clientId+'|'+o.season,()=>true);
add('CA par client',sortedClients().filter(c=>db.orders.some(o=>o.clientId===c.id)).map(c=>{const r={Client:c.name,Ville:c.city,Dépt:c.dept};cols.forEach(([b,s])=>r[`${b.name} ${s}`]=(pc.get(c.id+'|'+b.id+'|'+s)||Z).v);ss.forEach(s=>r[`TOTAL ${s}`]=(pt.get(c.id+'|'+s)||Z).v);return r}));
const ps=(keyFn,list,label)=>{const m=agg(o=>keyFn(o)+'|'+o.season,()=>true);return list.map(([id,name,extra])=>{const r={[label]:name,...extra};ss.forEach(s=>{const a=m.get(id+'|'+s)||Z;r[`Réalisé ${s}`]=a.v;r[`Objectif ${s}`]=a.obj;r[`N-1 ${s}`]=a.n1;r[`Commission ${s}`]=Math.round(a.c)});return r})};
add('CA par marque',ps(o=>o.brandId,db.brands.map(b=>[b.id,b.name,{'Commission %':b.commission}]),'Marque'));
add('CA par commercial',ps(o=>o.userId||'',[...db.users.map(u=>[u.id,u.name,{}]),['','Non affecté',{}]],'Commercial'));
add('Agenda',[...db.events].sort((a,b)=>(a.date+(a.start||'')).localeCompare(b.date+(b.start||''))).map(e=>({Date:e.date,Début:e.start,Fin:e.end,Type:e.type,Objet:e.title,Commercial:un(e.userId),Client:cn(e.clientId),Lieu:e.place,'Compte rendu':e.report})));
add('Marques',db.brands.map(b=>({Marque:b.name,'Commission %':b.commission,Contact:b.contact,Notes:b.notes})));
add('Équipe',db.users.map(u=>({Nom:u.name,Email:u.email})));
XLSX.writeFile(wb,`CRM_Meyaclo_export_${iso(new Date())}.xlsx`)}

function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download=`CRM_sauvegarde_${iso(new Date())}.json`;a.click()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=async()=>{let d;try{d=JSON.parse(r.result);if(!d.clients||!d.orders)throw 0}catch(e){return alert('Fichier invalide.')}
if(!confirm('Remplacer TOUTES les données de l\'équipe par cette sauvegarde ?'))return;
const{error}=await sb.from('records').delete().neq('id','');if(error)return alert('Erreur : '+error.message);
if(await putMany(KINDS.flatMap(k=>(d[k]||[]).map(o=>[k,o])))){db={brands:d.brands||[],users:d.users||[],clients:d.clients,orders:d.orders,events:d.events||[]};render();alert('Sauvegarde restaurée.')}};r.readAsText(f)}

sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.reload()});
start();
</script>
